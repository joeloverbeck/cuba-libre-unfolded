[package]
name = "cuba-libre-unfolded"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false

[features]
default = []
tabletop = ["dep:arboard", "dep:bevy", "dep:unfolded-hover", "unfolded-tabletop/seat"]

[dependencies]
# Shared packages, all at one revision of one repository, the same as the `wgpu-hal`
# patch below. The game, its saves and `cuba-tools` take only the packages that cannot
# depend on Bevy; `unfolded-hover`, which only the table uses, and `unfolded-tabletop`
# come with `tabletop`.
unfolded-agent-players = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7" }
unfolded-assets = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7" }
unfolded-hover = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7", optional = true }
unfolded-random = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7" }
unfolded-record-replacement = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7" }
unfolded-seat-client = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7" }
unfolded-tabletop = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
# The desktop's clipboard, for a seat's line (#206): text only.
arboard = { version = "3.6", optional = true, default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
bevy = { version = "=0.20.0", optional = true, default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_winit", "3d_bevy_render", "ui_bevy_render", "bevy_ui_widgets",
  "bevy_picking", "mesh_picking", "ui_picking", "default_font", "x11", "png", "jpeg", "bevy_gltf",
] }

[dev-dependencies]
anstream = { version = "1", default-features = false }
rustix = { version = "1", features = ["fs", "event"] }
tempfile = "3"

[[bin]]
name = "cuba-libre"
path = "src/bin/cuba-libre.rs"
required-features = ["tabletop"]

[profile.dev]
opt-level = 1
debug = 0
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
wgpu-hal = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "61953145a98fa3ac170d96c61c157856d33c03c7" }
