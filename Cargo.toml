[package]
name = "cuba-libre-unfolded"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[features]
default = []
tabletop = ["dep:bevy", "unfolded-tabletop/seat"]

[dependencies]
unfolded-tabletop = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "070701dfa6708338260c32228d108579bf19a760" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
bevy = { version = "=0.20.0", optional = true, default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_winit", "3d_bevy_render", "ui_bevy_render", "bevy_ui_widgets",
  "bevy_picking", "mesh_picking", "ui_picking", "default_font", "x11", "png", "jpeg", "bevy_gltf",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cuba-libre"
path = "src/bin/cuba-libre.rs"
required-features = ["tabletop"]

[profile.dev]
opt-level = 1
debug = 0
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
wgpu-hal = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "070701dfa6708338260c32228d108579bf19a760" }
